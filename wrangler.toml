name = "admin-canvas"
compatibility_date = "2024-10-01"
pages_build_output_dir = "./dist"

[[d1_databases]]
binding = "ANALYTICS_DB"
database_name = "cerebro-db-data"
database_id = "9f56c3bd-29d6-4eda-8348-1f6c5ce79e64"
migrations_dir = "migrations"

# Workers AI binding (available in Pages Functions via env.AI)
# For Cloudflare Pages, AI binding is configured via wrangler.toml
# The binding name "AI" will be available as env.AI in Pages Functions
[ai]
binding = "AI"

# KV namespace for caching AI insights
# Bindings are managed through wrangler.toml for Cloudflare Pages
[[kv_namespaces]]
binding = "INSIGHTS_CACHE"
id = "bcab6839b6aa44cd9a40add5e10246eb"
preview_id = "4a858f021a904c748bb4b0dd2f07af0f"
